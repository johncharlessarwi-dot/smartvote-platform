<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc"><title id="title">SMARTVOTE</title><desc id="desc">Animated decorative heading with readable project title. Animation is optional.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071A29"/><stop offset="1" stop-color="#183046"/></linearGradient></defs><rect width="1000" height="230" rx="20" fill="url(#bg)"/><path d="M0 178 Q230 70 450 165 T1000 110" fill="none" stroke="#82D6B2" stroke-opacity=".20" stroke-width="3"/><path d="M0 195 Q230 95 450 180 T1000 120" fill="none" stroke="#82D6B2" stroke-opacity=".4" stroke-width="3" stroke-dasharray="14 16"><animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/></path><circle cx="860" cy="115" r="66" fill="none" stroke="#82D6B2" stroke-opacity=".4"><animate attributeName="r" values="55;74;55" dur="7s" repeatCount="indefinite"/></circle><circle cx="860" cy="115" r="20" fill="#82D6B2" opacity=".75"><animate attributeName="opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></circle><text x="50" y="112" font-size="48" font-family="Arial,sans-serif" font-weight="700" fill="#fff">SMARTVOTE</text><text x="52" y="153" font-size="19" font-family="Arial,sans-serif" fill="#82D6B2">Project overview • Documentation • Development</text><text x="52" y="199" font-size="14" font-family="Arial,sans-serif" fill="#C9D8E3">GitHub repository showcase</text><style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style></svg>